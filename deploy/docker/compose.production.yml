name: ${AXIOM_STACK_NAME:-axiom-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:1a66d744c1b459e13b05a8fca341da84cb63383e99ce262210efee5a319d4551
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axiom}
      POSTGRES_USER: ${POSTGRES_USER:-axiom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a PostgreSQL password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes: [axiom-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  server:
    image: ${AXIOM_IMAGE_PREFIX:-axiom}/server:${AXIOM_RELEASE:-local}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      args: {AXIOM_BUILD_VERSION: "${AXIOM_RELEASE:-local}"}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AXIOM_ENV: production
      AXIOM_HTTP_ADDR: ":8080"
      AXIOM_ADMIN_USER: ${AXIOM_ADMIN_USER:-admin}
      AXIOM_ADMIN_PASSWORD: ${AXIOM_ADMIN_PASSWORD:?Generate an administrator password}
      AXIOM_JWT_SECRET: ${AXIOM_JWT_SECRET:?Generate a JWT secret}
      # Only needed while migrating HMAC passwords after signing-key rotation.
      AXIOM_LEGACY_PASSWORD_SECRET: ${AXIOM_LEGACY_PASSWORD_SECRET:-}
      AXIOM_MASTER_KEY: ${AXIOM_MASTER_KEY:?Generate an encryption master key}
      AXIOM_AGENT_TOKEN: ${AXIOM_AGENT_TOKEN:?Generate an Agent token}
      AXIOM_DATABASE_URL: ${AXIOM_DATABASE_URL:?Set the PostgreSQL connection URL}
      AXIOM_DATA_DIR: /app/data
      AXIOM_SNAPSHOT_DIR: /app/data/snapshots
      # Recovery restarts the SDK and can spend again. Web retry is the default.
      AXIOM_MAX_RECOVERIES: ${AXIOM_MAX_RECOVERIES:-0}
    volumes: [axiom-data:/app/data]
    read_only: true
    tmpfs: ["/tmp:uid=1001,gid=1001,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /opt/axiom/bin/axiom-server, --healthcheck]
      interval: 5s
      timeout: 4s
      start_period: 15s
      retries: 6
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

  agent:
    image: ${AXIOM_IMAGE_PREFIX:-axiom}/agent:${AXIOM_RELEASE:-local}
    # Current pinned SDK/runtime baseline was verified on Linux x64.
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
      args: {AXIOM_BUILD_VERSION: "${AXIOM_RELEASE:-local}"}
    depends_on:
      server: {condition: service_healthy}
    environment:
      AXIOM_SERVER_URL: http://server:8080
      AXIOM_AGENT_TOKEN: ${AXIOM_AGENT_TOKEN:?Generate an Agent token}
      AXIOM_AGENT_ID: ${AXIOM_AGENT_ID:-agent-local}
      AXIOM_SCAN_MOCK: ${AXIOM_SCAN_MOCK:-0}
      AXIOM_DATA_DIR: /app/data
      AXIOM_SCANNER_DIR: /opt/axiom/code-audit-scanner
      AXIOM_NODE: /usr/local/bin/node
      AXIOM_AGENT_HEALTH_FILE: /tmp/agent-health.json
    volumes: [axiom-data:/app/data]
    init: true
    read_only: true
    tmpfs: ["/tmp:uid=1001,gid=1001,mode=1777"]
    # SDK attempt state is private; persistent execution identities stay under /app/data/.sdk-identities.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/axiom-agent, --healthcheck]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 5
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *logging

  web:
    image: ${AXIOM_IMAGE_PREFIX:-axiom}/web:${AXIOM_RELEASE:-local}
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web.production
      args: {AXIOM_BUILD_VERSION: "${AXIOM_RELEASE:-local}"}
    depends_on:
      server: {condition: service_healthy}
    ports: ["${AXIOM_BIND_ADDR:-127.0.0.1}:${AXIOM_WEB_PORT:-8088}:8080"]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 5s
      retries: 6
    stop_grace_period: 10s
    restart: unless-stopped
    logging: *logging

volumes:
  axiom-data:
  axiom-postgres:
