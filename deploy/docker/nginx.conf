worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Re-resolve the Server after a Compose replacement changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Match the Server's 2 GiB archive limit plus multipart overhead.
        client_max_body_size 2049m;
        client_body_timeout 120s;
        include /etc/nginx/security-headers.conf;
        set $axiom_backend http://server:8080;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"alive"}';
        }
        location = /readyz {
            proxy_pass $axiom_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            add_header Cache-Control no-store always;
            include /etc/nginx/security-headers.conf;
        }
        # Agents use the private Server network. Never expose their control API
        # through the user-facing Web entry point.
        location ^~ /api/internal/ { return 404; }
        location /api/ {
            proxy_pass $axiom_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            # Stream uploads/events; don't spool a second archive copy in Web.
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }
        location = /index.html {
            add_header Cache-Control no-store always;
            include /etc/nginx/security-headers.conf;
        }
        # Development source and HMR endpoints are absent from static releases.
        location ~ ^/(?:@vite|@id|@fs|src|node_modules)(?:/|$) { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
            include /etc/nginx/security-headers.conf;
        }
    }
}
